[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeos"
version = "0.6.10"
description = "Cost-governed agent harness: eliminate the request, auto-discover adapters, circuit-break dead workers, cache prompt prefixes, compile NLP objectives, diff-aware security scanning, full CLI."
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
authors = [{name = "jacobbyrne72"}]
keywords = [
    "ai", "llm", "agents", "coding-agent", "cost-optimization",
    "token-optimization", "orchestration", "multi-agent", "harness",
]
# Trove classifiers are how PyPI search and filtering work at all; without
# them the listing is unfindable by anyone who does not already know the
# name. Kept to claims that are true today: 3.11/3.12 are what CI proves.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    # No "License :: OSI Approved :: ..." classifier here on purpose: this
    # project declares `license = "MIT"`, a PEP 639 license EXPRESSION, and
    # setuptools rejects a build that carries both ("License classifiers have
    # been superseded by license expressions"). Adding one broke every CI leg
    # at `pip install` — before a single test ran.
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
scripts = {forge = "forgeos.cli:main"}
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    # Used by the resource governor and the token preflight; both are on the
    # default path, so they are hard requirements rather than extras.
    "psutil>=5.9",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
gateway = ["litellm"]
dev = ["pytest>=8"]

# Declared AFTER every array in [project]: a TOML table header captures
# everything until the next header, so placing this above `dependencies`
# silently swallowed it into the urls table — the package would have shipped
# with no declared dependencies at all. Caught by parsing the file back and
# checking what landed where, which is the only way this class of TOML bug
# announces itself.
[project.urls]
Homepage = "https://github.com/jacobbyrne72/ForgeOS"
Repository = "https://github.com/jacobbyrne72/ForgeOS"
Issues = "https://github.com/jacobbyrne72/ForgeOS/issues"
Changelog = "https://github.com/jacobbyrne72/ForgeOS/releases"

[tool.setuptools.packages.find]
# hooks/ and research/ are tooling and corpus scripts, not part of the
# installable package; without this pin setuptools' flat-layout discovery
# refuses to build ("Multiple top-level packages discovered").
include = ["forgeos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Deliberately NOT "-q": combined with a caller's own -q this becomes -qq, which
# suppresses pytest's "N passed" summary entirely. That silently hid the test count
# for most of this project's history and got misattributed to the RTK wrapper.
addopts = "--tb=short"
pythonpath = ["."]
markers = [
    # Tests that spawn real subprocesses (git, gitleaks, ruff, semgrep). They are
    # the ones that genuinely prove the integrations work, and also the ones that
    # make the suite unusable to run on every edit. Deselect with -m "not slow"
    # during iteration; run everything at the merge boundary. This is the
    # verification ladder from forgeos/economy/testselect.py applied to forgeos itself.
    "slow: spawns real external processes; run at the merge boundary, not per-edit",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# The explicit lint contract: pyflakes + the pycodestyle error classes the
# codebase is clean on today. Without an explicit select, every ruff release
# can widen the default set and turn a green tree red on CI while local stays
# green — which is exactly what happened on the first public CI run. Widen
# deliberately (one rule family per PR, tree kept clean), never implicitly.
select = ["E4", "E7", "E9", "F"]
