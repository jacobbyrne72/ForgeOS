name: weekly-fleet-report

# The growth loop: every Monday, probe which free tiers are alive,
# post the results as a Discussion. Recurring, useful, citable.
# Nobody else publishes "which $0 models actually work THIS WEEK."

on:
  schedule:
    - cron: "0 8 * * 1"  # Monday 08:00 UTC
  workflow_dispatch: {}   # manual trigger for testing

permissions:
  contents: read
  discussions: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" httpx

      - name: Probe free tiers
        id: probe
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python tools/fleet_probe.py --json > fleet_report.json
          echo "report<<fleet_report.json" >> "$GITHUB_OUTPUT"

      - name: Post to Discussions
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('fleet_report.json', 'utf8'));
            const date = new Date().toISOString().split('T')[0];

            // Build the markdown body
            let body = `## Free Fleet Report — ${date}\n\n`;
            body += `Which $0 models actually answered a probe THIS WEEK.\n`;
            body += `Reproducible: \`pip install forgeos && python tools/fleet_probe.py\`\n\n`;

            body += `| Provider | Model | Status | Latency |\n`;
            body += `|----------|-------|--------|--------|\n`;
            for (const r of report.results) {
              const icon = r.alive ? '✅' : '❌';
              const latency = r.alive ? `${r.latency_ms}ms` : '—';
              body += `| ${r.provider} | ${r.model} | ${icon} ${r.alive ? 'alive' : 'dead'} | ${latency} |\n`;
            }

            const alive = report.results.filter(r => r.alive).length;
            const total = report.results.length;
            body += `\n**${alive}/${total} free tiers alive this week.**\n\n`;
            body += `---\n`;
            body += `*Generated by [ForgeOS](https://github.com/${context.repo.owner}/${context.repo.repo}) — `;
            body += `the cost-governed harness that routes through free tiers and subscriptions before touching metered API.*`;

            // Find or create the "Fleet Reports" category
            const categories = await github.graphql(`
              query($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  discussionCategories(first: 25) {
                    nodes { id name }
                  }
                }
              }
            `, { owner: context.repo.owner, repo: context.repo.repo });

            let categoryId = categories.repository.discussionCategories.nodes
              .find(c => c.name === 'Fleet Reports')?.id;

            if (!categoryId) {
              // Use Announcements as fallback
              categoryId = categories.repository.discussionCategories.nodes
                .find(c => c.name === 'Announcements')?.id;
            }

            if (!categoryId) {
              core.warning('No suitable discussion category found, skipping post');
              return;
            }

            await github.graphql(`
              mutation($repo: ID!, $category: ID!, $title: String!, $body: String!) {
                createDiscussion(input: {
                  repositoryId: $repo,
                  categoryId: $category,
                  title: $title,
                  body: $body
                }) {
                  discussion { url }
                }
              }
            `, {
              repo: (await github.graphql(`
                query($owner: String!, $repo: String!) {
                  repository(owner: $owner, name: $repo) { id }
                }
              `, { owner: context.repo.owner, repo: context.repo.repo })).repository.id,
              category: categoryId,
              title: `Free Fleet Report — ${date}`,
              body: body
            });
