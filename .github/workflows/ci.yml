name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # ruff is pinned so CI and a contributor's machine judge the same rules;
      # the rule *selection* itself is pinned in pyproject [tool.ruff.lint].
      - run: pip install -e ".[dev]" "ruff==0.15.12"
      # Lint before tests: a style/import error fails in two seconds, and the
      # config in pyproject.toml is the single source of what "clean" means.
      - run: ruff check forgeos/ tests/ tools/
      # The fast path first: a broken unit fails in seconds, not after the
      # slow integration tests have spent their minutes.
      - run: python -m pytest tests -q -m "not slow"
      # API-only dashboard contract: starts an isolated fixture and never
      # needs Playwright, credentials, or a provider call on CI. Preserve the
      # compact JSON/error output even when this gate fails, so a red matrix
      # leg carries its diagnosis instead of only an exit code.
      - name: Dashboard smoke (API-only)
        shell: bash
        run: |
          python -c "from pathlib import Path; Path('artifacts').mkdir(exist_ok=True)"
          set +e
          python tools/dashboard_smoke.py --no-browser --port 8894 > artifacts/dashboard-smoke.json 2>&1
          status=$?
          python -c "from pathlib import Path; print(Path('artifacts/dashboard-smoke.json').read_text())"
          exit $status
      - name: Add dashboard smoke to step summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Dashboard smoke (API-only)'
            echo '```json'
            cat artifacts/dashboard-smoke.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload dashboard smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-smoke-${{ matrix.os }}-py${{ matrix.python }}
          path: artifacts/dashboard-smoke.json
          if-no-files-found: error
      - run: python -m pytest tests -q -m "slow"
